<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" stroke="white" stroke-opacity="0.04" stroke-width="1" fill="none"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(80, 80)">
    <rect width="56" height="56" rx="14" fill="url(#brand)"/>
    <text x="76" y="38" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="white" letter-spacing="-0.5">GearGrid</text>
  </g>

  <text x="80" y="320" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="76" font-weight="600" fill="white" letter-spacing="-2">The OS for</text>
  <text x="80" y="402" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="76" font-weight="600" fill="url(#brand)" letter-spacing="-2">equipment rental.</text>

  <text x="80" y="470" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="26" fill="#94a3b8">Inventory · Rentals · Maintenance · Accounting</text>

  <g transform="translate(80, 540)">
    <circle cx="6" cy="6" r="4" fill="#22c55e"/>
    <text x="22" y="11" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">All systems operational</text>
    <text x="1040" y="11" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8" text-anchor="end">geargrid.live</text>
  </g>

  <g transform="translate(720, 200)" opacity="0.85">
    <rect width="380" height="240" rx="16" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <g transform="translate(20, 30)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" font-weight="600">REVENUE · MTD</text>
      <text y="32" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="white">Rs 4.2M</text>
      <text x="180" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#22c55e">+18.4%</text>
    </g>
    <g transform="translate(20, 120)">
      <rect x="0" y="40" width="22" height="50" rx="3" fill="#475569"/>
      <rect x="30" y="20" width="22" height="70" rx="3" fill="#475569"/>
      <rect x="60" y="30" width="22" height="60" rx="3" fill="#475569"/>
      <rect x="90" y="10" width="22" height="80" rx="3" fill="#475569"/>
      <rect x="120" y="25" width="22" height="65" rx="3" fill="url(#brand)"/>
      <rect x="150" y="5" width="22" height="85" rx="3" fill="url(#brand)"/>
      <rect x="180" y="15" width="22" height="75" rx="3" fill="url(#brand)"/>
      <rect x="210" y="0" width="22" height="90" rx="3" fill="url(#brand)"/>
      <rect x="240" y="20" width="22" height="70" rx="3" fill="#fbbf24"/>
      <rect x="270" y="10" width="22" height="80" rx="3" fill="#fbbf24"/>
      <rect x="300" y="5" width="22" height="85" rx="3" fill="#fbbf24"/>
      <rect x="330" y="0" width="22" height="90" rx="3" fill="#fbbf24"/>
    </g>
  </g>
</svg>
