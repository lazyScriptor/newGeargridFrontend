      <header style="max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif;">
        <h1 style="font-size: 2.25rem; font-weight: 700; color: #0f172a;">
          GearGrid — Equipment Rental &amp; Inventory Management Software
        </h1>
        <p style="font-size: 1.25rem; color: #475569; line-height: 1.6; margin-top: 0.5rem;">
          The all-in-one operating platform engineered for equipment rental businesses. Stop losing gear, eliminate double-bookings, protect collateral, and speed up counter checkouts.
        </p>
      </header>

      <main style="max-width: 900px; margin: 0 auto; padding: 0 1.5rem 3rem; font-family: system-ui, sans-serif; color: #1e293b; line-height: 1.7;">
        <section style="margin-top: 2rem;">
          <h2 style="font-size: 1.5rem; color: #0f172a;">Core Platform Features</h2>
          <ul>
            <li><strong>Live Equipment Availability Calendar:</strong> Instant visibility into what is on shelf, rented out, overdue, or in maintenance. Never double-book high-value gear.</li>
            <li><strong>60-Second Counter POS:</strong> Blazing-fast rental dispatch, contract generation, thermal receipt &amp; PDF invoice printing.</li>
            <li><strong>Customer ID Card Security Vault:</strong> Record National Identity Card (NIC) or Passport numbers and lock collateral status to protect valuable rental assets.</li>
            <li><strong>Automated Overdue Late Fees:</strong> Real-time automated fee calculation prevents awkward counter disputes when gear returns late.</li>
            <li><strong>Integrated Workshop &amp; Repairs:</strong> Route returned defective gear directly to maintenance logs with repair cost tracking and deduction from customer deposits.</li>
            <li><strong>Multi-Branch &amp; Mobile Ready:</strong> Access your rental counter and daily earnings from your smartphone, tablet, or laptop anywhere in the world.</li>
          </ul>
        </section>

        <section style="margin-top: 2rem;">
          <h2 style="font-size: 1.5rem; color: #0f172a;">Industries Built For</h2>
          <ul>
            <li><strong>Camera, Lens &amp; Cinema Production Rentals:</strong> Serialized gear tracking, kit bundling, and crew checkout.</li>
            <li><strong>AV, Sound, Lighting &amp; Stage Gear:</strong> Event logistics, multi-day bookings, and roadcase pack lists.</li>
            <li><strong>Power Tools &amp; Construction Equipment:</strong> Generators, drills, compactors, and heavy machinery hire.</li>
            <li><strong>Party, Wedding &amp; Event Rentals:</strong> Tents, seating, decor, and catering equipment.</li>
          </ul>
        </section>

        <section style="margin-top: 2rem; padding: 1.5rem; background-color: #f8fafc; border-radius: 8px;">
